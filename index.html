<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tele España</title>
<meta name="description" content="Canales de televisión de España en directo">
<meta name="theme-color" content="#EDEEF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0F15" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<style>
:root{
  /* Concepto: sintonizador de TV. Pantalla fija arriba con carta de ajuste, parrilla de canales debajo. */
  --bg:#EDEEF2; --surface:#FFFFFF; --ink:#12151C; --muted:#5A6270; --line:#D5D8E0;
  --accent:#1F4FD8; --accent-ink:#FFFFFF; --tint:#E3EBFF; --live:#D6322E; --logo-bg:#FFFFFF;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F15; --surface:#151A23; --ink:#EDF0F5; --muted:#98A1B0; --line:#262D3A;
    --accent:#6F96FF; --accent-ink:#07122E; --tint:#172240; --live:#FF5A55; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F15; --surface:#151A23; --ink:#EDF0F5; --muted:#98A1B0; --line:#262D3A;
  --accent:#6F96FF; --accent-ink:#07122E; --tint:#172240; --live:#FF5A55; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--f-body);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:76rem;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:max(16px,env(safe-area-inset-top,0px)) max(2.5rem,env(safe-area-inset-bottom,0px))}
header{display:grid;gap:.9rem;margin-bottom:1rem}
.bars{display:flex;height:6px;border-radius:3px;overflow:hidden;max-width:11rem}
.bars i{flex:1}
.bars i:nth-child(1){background:#C4C4C4}.bars i:nth-child(2){background:#C4C400}.bars i:nth-child(3){background:#00C4C4}
.bars i:nth-child(4){background:#00C400}.bars i:nth-child(5){background:#C400C4}.bars i:nth-child(6){background:#C40000}.bars i:nth-child(7){background:#0000C4}
h1{margin:.5rem 0 0;font:700 clamp(2.4rem,9vw,3.6rem)/.9 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
h1 span{color:var(--accent)}
.sub{margin:.3rem 0 0;color:var(--muted)}
.search input{width:100%;min-height:3.25rem;padding:.7rem 1rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.search input::placeholder{color:var(--muted)}
.tabs{display:flex;gap:.5rem;flex-wrap:wrap}
.tabs button{min-height:3rem;padding:.5rem 1.1rem;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs b{font-family:var(--f-mono);font-weight:500;margin-left:.35rem}

.layout{display:grid;gap:1rem;grid-template-columns:minmax(0,1fr);align-items:start}
.player{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:.4rem;display:grid;gap:.6rem;min-width:0}
@media (min-width:62rem){
  .layout{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1.5rem}
  .player{top:1rem}
}
.screen{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:10px;overflow:hidden}
.screen video{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:contain}
.screen:not(.on) video{visibility:hidden}
.testcard{position:absolute;inset:0;display:grid;grid-template-rows:68% 8% 24%;background:#000}
.screen.on .testcard{display:none}
.testcard .t1{background:linear-gradient(90deg,#C4C4C4 0 14.285%,#C4C400 0 28.571%,#00C4C4 0 42.857%,#00C400 0 57.142%,#C400C4 0 71.428%,#C40000 0 85.714%,#0000C4 0)}
.testcard .t2{background:linear-gradient(90deg,#0000C4 0 14.285%,#131313 0 28.571%,#C400C4 0 42.857%,#131313 0 57.142%,#00C4C4 0 71.428%,#131313 0 85.714%,#C4C4C4 0)}
.testcard .t3{display:grid;place-items:center;color:#fff;font:500 .85rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;text-align:center;padding:0 .5rem}
.chip{position:absolute;left:.6rem;top:.6rem;display:none;align-items:center;gap:.4rem;padding:.2rem .6rem;border-radius:4px;background:rgba(0,0,0,.65);color:#fff;font:500 .75rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;pointer-events:none}
.chip.show{display:inline-flex}
.chip i{width:.55rem;height:.55rem;border-radius:50%;background:#FFB020}
.chip.live i{background:#FF4B45}

.now{display:flex;align-items:center;gap:.7rem;min-width:0;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.now .info{flex:1;min-width:0;display:grid;gap:.1rem}
.now .title{font:700 1.5rem/1.05 var(--f-display);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .status{font:500 .78rem var(--f-mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.now .status.live{color:var(--live)}
.now .status.bad{color:var(--live)}
.ctl{display:flex;align-items:center;gap:.4rem;flex:none}
.ctl button{width:3rem;height:3rem;border-radius:50%;border:1px solid var(--line);background:var(--bg);display:grid;place-items:center}
.ctl button svg{width:1.3rem;height:1.3rem;fill:currentColor}
.ctl .main{width:3.5rem;height:3.5rem;background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ctl .main svg{width:1.6rem;height:1.6rem}
.ctl button[disabled]{opacity:.4;cursor:default}
@media (max-width:30rem){
  .now .logo{display:none}
  .ctl{gap:.3rem}
  .ctl button{width:2.75rem;height:2.75rem}
  .ctl .main{width:3.25rem;height:3.25rem}
}

.list{min-width:0}
.group{margin:0 0 1.5rem}
.group h2{margin:0 0 .6rem;font:700 1.3rem/1 var(--f-display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
ul.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:.6rem}
.row{display:flex;align-items:stretch;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.row.on{background:var(--tint);border-color:var(--accent)}
.row .play{flex:1;min-width:0;display:flex;align-items:center;gap:.8rem;padding:.55rem .8rem;min-height:4.25rem;border:0;background:none;text-align:left}
.logo{flex:none;width:4.2rem;height:2.7rem;border-radius:5px;background:var(--logo-bg);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;font:700 1.15rem/1 var(--f-display);color:#586070;padding:.2rem}
.logo img{width:100%;height:100%;object-fit:contain}
.txt{min-width:0;display:grid;gap:.1rem}
.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:.8rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
a.play{text-decoration:none;color:inherit}
.ext{flex:none;width:1.1rem;height:1.1rem;fill:none;stroke:var(--muted);stroke-width:2}
.fav{flex:none;width:3.5rem;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);display:grid;place-items:center}
.fav svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:2}
.fav.is{color:var(--accent)}
.fav.is svg{fill:currentColor}
.dot{display:none;flex:none;width:.6rem;height:.6rem;border-radius:50%;background:var(--live)}
.row.on .dot{display:block}
.msg{padding:1.5rem 0;color:var(--muted)}
.msg.err{color:var(--ink)}
.foot{margin:1.5rem 0 0;font-size:.8rem;color:var(--muted);max-width:60ch}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h1>Tele <span>España</span></h1>
      <p class="sub" id="sub">Canales de televisión en directo</p>
    </div>
    <label class="search">
      <span class="sr">Buscar canal</span>
      <input id="q" type="search" placeholder="Buscar canal o ciudad" autocomplete="off" enterkeyhint="search">
    </label>
    <div class="tabs" role="tablist" aria-label="Listas">
      <button role="tab" type="button" data-tab="nat" aria-selected="true">Destacados</button>
      <button role="tab" type="button" data-tab="fav" aria-selected="false">Favoritos<b id="nfav"></b></button>
      <button role="tab" type="button" data-tab="all" aria-selected="false">Todos</button>
    </div>
  </header>

  <div class="layout">
    <section class="player" aria-label="Reproductor">
      <div class="screen" id="screen">
        <video id="video" controls playsinline preload="none"></video>
        <div class="testcard" aria-hidden="true">
          <div class="t1"></div><div class="t2"></div>
          <div class="t3">Elige un canal</div>
        </div>
        <div class="chip" id="chip"><i></i><span id="chiptext"></span></div>
      </div>
      <div class="now">
        <div class="logo" id="plogo" aria-hidden="true"></div>
        <div class="info">
          <div class="title" id="ptitle">Sin canal</div>
          <div class="status" id="pstatus">Toca un canal de la lista</div>
        </div>
        <div class="ctl">
          <button type="button" id="prev" aria-label="Canal anterior" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9.500 12z"/></svg>
          </button>
          <button type="button" class="main" id="toggle" aria-label="Ver" disabled></button>
          <button type="button" id="next" aria-label="Canal siguiente" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 5h2v14h-2zM4 5l10.500 7L4 19z"/></svg>
          </button>
          <button type="button" id="alt" aria-label="Probar otra emisión de este canal" disabled>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.650 6.350A8 8 0 1 0 19.730 14h-2.080A6 6 0 1 1 12 6c1.660 0 3.140.690 4.220 1.780L13 11h7V4z"/></svg>
          </button>
        </div>
      </div>
    </section>

    <div class="list">
      <main id="main" aria-live="polite"></main>
      <p class="foot" id="foot"></p>
    </div>
  </div>
</div>

<script>

    tab: 'nat', q: '',

    cur: null, si: 0, list: [], view: [], playing: false, want: false

  function parseM3U(text) {
    var out = [], lines = text.split(/\r?\n/), cur = null, i, l;

    entries.forEach(function (e) {

      ch.src.push({ u: e.url, q: c.q, geo: c.geo, off: c.off, ref: !!(e.ref || e.ua) });
    });
    // Las emisiones que piden cabeceras especiales casi nunca funcionan en un navegador: se prueban las últimas.
    order.forEach(function (ch) {
      ch.src = ch.src.map(function (s, i) { return { s: s, i: i }; })
        .sort(function (a, b) { return (a.s.ref - b.s.ref) || (a.i - b.i); })
        .map(function (x) { return x.s; });
    });
    return order;
  }
  function prep(text) {
    state.chs = build(parseM3U(text));
    state.chs.sort(function (a, b) { return norm(a.name) < norm(b.name) ? -1 : norm(a.name) > norm(b.name) ? 1 : 0; });
    state.byId = {};
    state.chs.forEach(function (c) { state.byId[c.id] = c; });
    var used = {};
    state.missing = [];
    state.groups = FEATURED.map(function (grp) {
      var items = [];
      grp.items.forEach(function (it) {
        var found = null, i;
        for (i = 0; i < state.chs.length && !found; i++) {
          var c = state.chs[i];
          if (used[c.id]) continue;
          if (it.re.some(function (r) { return r.test(c.name); })) found = c;
        }
        if (found) {
          used[found.id] = 1;
          items.push({ id: found.id, name: it.n, tdt: it.tdt || 0, logo: found.logo, src: found.src });
        } else state.missing.push(it.n);
      });
      return { g: grp.g, items: items };
    });
    state.favs = state.favs.map(function (f) { return state.byId[f.id] || f; });
    write('tele.favs', state.favs);
    if (!state.cur && state.lastId && state.byId[state.lastId]) { state.cur = state.byId[state.lastId]; state.si = 0; }
  }
  async function fetchList() {
    var err, i;
    for (i = 0; i < LISTS.length; i++) {
      try {
        var r = await fetch(LISTS[i]);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var t = await r.text();
        if (t.indexOf('#EXTINF') < 0) throw new Error('lista vacía');
        return t;
      } catch (e) { err = e; }
    }
    throw err;
  }
  async function init() {
    var c = read(CACHE_KEY, null);
    if (c && c.text) { prep(c.text); render(); ui(); }
    else showMsg('Cargando canales…');
    if (c && Date.now() - c.t < CACHE_MS) return;
    try {
      var text = await fetchList();
      write(CACHE_KEY, { t: Date.now(), text: text });
      prep(text); render(); ui();
    } catch (e) {
      if (!state.chs.length) showMsg('No se pudo cargar la lista de canales. Comprueba la conexión y vuelve a abrir la app.', true);
    }
  }

  /* ---------- lista en pantalla ---------- */
  function showMsg(text, err) {
    $('#main').replaceChildren(h('p', { class: 'msg' + (err ? ' err' : '') }, text));
  }
  function filt(arr) {
    var q = norm(state.q).trim();
    if (!q) return arr;
    return arr.filter(function (c) { return norm(c.name).indexOf(q) > -1; });
  }
  function isFav(id) { return state.favs.some(function (f) { return f.id === id; }); }
  function toggleFav(c) {
    if (isFav(c.id)) state.favs = state.favs.filter(function (f) { return f.id !== c.id; });
    else state.favs.push({ id: c.id, name: c.name, logo: c.logo, src: c.src });
    write('tele.favs', state.favs);
    render(true);
  }
  function initials(name) {
    var w = name.replace(/[^\p{L}\p{N} ]/gu, '').split(/\s+/).filter(Boolean);
    return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
  }
  function logo(c, el) {
    el.replaceChildren();
    if (c.logo && (!HTTPS || /^https:/i.test(c.logo))) {
      var img = h('img', { src: c.logo, alt: '', loading: 'lazy', referrerpolicy: 'no-referrer' });
      img.addEventListener('error', function () { el.replaceChildren(initials(c.name)); });
      el.append(img);
    } else el.append(initials(c.name));
    return el;
  }
  function metaOf(c) {
    var p = [];
    if (c.tdt) p.push('TDT ' + c.tdt);
    if (c.src[0] && c.src[0].q) p.push(c.src[0].q);
    if (c.src.length > 1) p.push(c.src.length + ' emisiones');
    return p.join(' · ');
  }
  function card(c) {
    var on = state.cur && state.cur.id === c.id, fav = isFav(c.id);
    var favBtn = h('button', { class: 'fav' + (fav ? ' is' : ''), type: 'button', 'aria-pressed': String(fav),
      'aria-label': (fav ? 'Quitar de favoritos ' : 'Añadir a favoritos ') + c.name, onclick: function () { toggleFav(c); } });
    favBtn.innerHTML = ICON_HEART;
    return h('li', { class: 'row' + (on ? ' on' : '') },
      h('button', { class: 'play', type: 'button', 'aria-label': 'Ver ' + c.name, onclick: function () { start(c); } },
        logo(c, h('span', { class: 'logo' })),
        h('span', { class: 'txt' }, h('span', { class: 'nm' }, c.name), h('span', { class: 'meta' }, metaOf(c))),
        h('span', { class: 'dot', 'aria-hidden': 'true' })),
      favBtn);
  }
  function linkCard(o) {
    var ext = h('span', { 'aria-hidden': 'true' });
    ext.innerHTML = '<svg class="ext" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    return h('li', { class: 'row' },
      h('a', { class: 'play', href: o.u, target: '_blank', rel: 'noopener noreferrer', 'aria-label': 'Abrir ' + o.name + ' en ' + o.site },
        logo({ name: o.name, logo: '' }, h('span', { class: 'logo' })),
        h('span', { class: 'txt' }, h('span', { class: 'nm' }, o.name), h('span', { class: 'meta' }, o.site + ' · se abre en su web')),
        ext));
  }
  function render(keepScroll) {
    var y = window.scrollY, main = $('#main'), flat = [], total = 0;
    main.replaceChildren();
    $('#nfav').textContent = state.favs.length ? state.favs.length : '';
    if (state.tab === 'nat') {
      state.groups.forEach(function (grp) {
        var items = filt(grp.items);
        if (!items.length) return;
        flat = flat.concat(items); total += items.length;
        main.append(h('section', { class: 'group' }, h('h2', null, grp.g), h('ul', { class: 'grid' }, items.map(card))));
      });
      var offs = filt(OFFICIAL.filter(function (o) { return state.missing.indexOf(o.name) > -1; }));
      if (offs.length) {
        total += offs.length;
        main.append(h('section', { class: 'group' }, h('h2', null, 'Ver en su web oficial'), h('ul', { class: 'grid' }, offs.map(linkCard))));
      }
    } else {
      flat = filt(state.tab === 'fav' ? state.favs : state.chs);
      total = flat.length;
      if (total) main.append(h('ul', { class: 'grid' }, flat.map(card)));
    }
    if (!total) {
      var q = state.q.trim();
      main.append(h('p', { class: 'msg' }, q ? 'Ningún canal coincide con «' + q + '».'
        : state.tab === 'fav' ? 'Aún no tienes favoritos. Toca el corazón de cualquier canal para guardarlo aquí.'
        : 'No hay canales para mostrar.'));
    }
    state.view = flat;
    $('#sub').textContent = state.tab === 'all' ? state.chs.length + ' canales de España'
      : state.tab === 'fav' ? 'Tus canales guardados' : 'Canales de televisión en directo';
    var foot = 'Canales y direcciones de iptv-org, un directorio abierto de emisiones públicas. Algunos canales solo funcionan dentro de España y otros dejan de emitir sin aviso.';
    if (state.skipped) foot += ' Se han ocultado ' + state.skipped + ' emisiones sin conexión segura.';
    if (state.tab === 'nat' && state.missing.length) foot += ' No están disponibles ahora: ' + state.missing.join(', ') + '.';
    $('#foot').textContent = foot;
    if (keepScroll) window.scrollTo(0, y);
  }

  /* ---------- reproductor ---------- */
  var hls = null, gen = 0, timer = 0;

  function setStatus(text, cls) {
    var s = $('#pstatus'); s.textContent = text; s.className = 'status' + (cls ? ' ' + cls : '');
    var chip = $('#chip');
    chip.className = 'chip' + (state.want && (cls === 'live' || cls === 'conn') ? ' show' : '') + (cls === 'live' ? ' live' : '');
    $('#chiptext').textContent = cls === 'live' ? 'En directo' : 'Conectando';
  }
  function ui() {
    var c = state.cur;
    var t = $('#toggle');
    t.disabled = !c;
    t.innerHTML = state.want ? ICON_PAUSE : ICON_PLAY;
    t.setAttribute('aria-label', state.want ? 'Parar' : 'Ver');
    $('#prev').disabled = $('#next').disabled = !c || state.list.length < 2;
    $('#alt').disabled = !c || c.src.length < 2;
    if (c) {
      $('#ptitle').textContent = c.name;
      logo(c, $('#plogo'));
      if (!state.want && !state.playing && $('#pstatus').textContent === 'Toca un canal de la lista') setStatus('Toca ▶ para continuar');
    }
  }
  function mediaSession(c) {
    if (!('mediaSession' in navigator) || !window.MediaMetadata) return;
    navigator.mediaSession.metadata = new MediaMetadata({ title: c.name, artist: 'Tele España' });
  }
  function teardownHls() {
    if (hls) { try { hls.destroy(); } catch (e) { /* nada */ } hls = null; }
  }
  function teardown() {
    clearTimeout(timer);
    teardownHls();
    try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) { /* nada */ }
    state.playing = false;
  }
  function tryPlay() { var p = video.play(); if (p && p.catch) p.catch(function () {}); }

  function play() {
    var c = state.cur;
    if (!c || !c.src.length) return;
    var my = ++gen, s = c.src[state.si], triedNative = false, media = 0;
    teardown();
    $('#screen').classList.add('on');
    setStatus('Conectando…' + (c.src.length > 1 ? ' (emisión ' + (state.si + 1) + '/' + c.src.length + ')' : ''), 'conn');
    function nativePlay() { video.src = s.u; tryPlay(); }
    if (window.Hls && window.Hls.isSupported()) {
      hls = new window.Hls({ maxBufferLength: 20, manifestLoadingMaxRetry: 1, levelLoadingMaxRetry: 1, fragLoadingMaxRetry: 2 });
      hls.on(window.Hls.Events.MANIFEST_PARSED, tryPlay);
      hls.on(window.Hls.Events.ERROR, function (_, d) {
        if (my !== gen || !d || !d.fatal) return;
        if (d.type === window.Hls.ErrorTypes.MEDIA_ERROR && media++ < 1) { hls.recoverMediaError(); return; }
        // Si el servidor no permite leer la lista desde una web, el reproductor del propio móvil suele poder.
        if (!triedNative) { triedNative = true; teardownHls(); nativePlay(); return; }
        next();
      });
      hls.loadSource(s.u);
      hls.attachMedia(video);
    } else nativePlay();
    timer = setTimeout(function () { if (my === gen && !state.playing) next(); }, 20000);
  }
  function start(c) {
    state.cur = c; state.si = 0; state.want = true;
    state.list = state.view && state.view.length ? state.view.slice() : [c];
    write('tele.last', c.id);
    ui(); mediaSession(c); render(true); play(); ui();
  }
  function next() {
    var c = state.cur;
    if (!c || !state.want) return;
    if (state.si + 1 < c.src.length) { state.si++; play(); }
    else {
      gen++; teardown(); state.want = false;
      setStatus('No se puede ver este canal ahora. Prueba otro.', 'bad'); ui();
    }
  }
  function altSource() {
    var c = state.cur;
    if (!c || c.src.length < 2) return;
    state.si = (state.si + 1) % c.src.length; state.want = true; play(); ui();
  }
  function toggle() {
    if (!state.cur) return;
    if (state.want) { gen++; teardown(); state.want = false; $('#screen').classList.remove('on'); setStatus('Parado'); }
    else { state.want = true; play(); }
    ui();
  }
  function step(d) {
    if (!state.cur || state.list.length < 2) return;
    var i = state.list.findIndex(function (c) { return c.id === state.cur.id; });
    var target = state.list[(i + d + state.list.length) % state.list.length], keep = state.list;
    start(target); state.list = keep; ui();
  }

  video.addEventListener('playing', function () {
    clearTimeout(timer); state.playing = true;
    var s = state.cur && state.cur.src[state.si];
    setStatus('EN DIRECTO' + (s && s.q ? ' · ' + s.q : ''), 'live'); ui();
  });
  video.addEventListener('waiting', function () { if (state.want) setStatus('Cargando…', 'conn'); });
  video.addEventListener('pause', function () { state.playing = false; });
  video.addEventListener('error', function () { if (!hls) next(); });

  if ('mediaSession' in navigator) {
    var set = function (a, fn) { try { navigator.mediaSession.setActionHandler(a, fn); } catch (e) { /* no admitido */ } };
    set('play', toggle); set('pause', toggle);
    set('nexttrack', function () { step(1); }); set('previoustrack', function () { step(-1); });
  }

  /* ---------- eventos ---------- */
  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.addEventListener('click', function () {
      state.tab = b.dataset.tab;
      document.querySelectorAll('.tabs button').forEach(function (x) { x.setAttribute('aria-selected', String(x === b)); });
      render();
    });
  });
  var qt = 0;
  $('#q').addEventListener('input', function (e) {
    clearTimeout(qt);
    qt = setTimeout(function () { state.q = e.target.value; render(true); }, 120);
  });
  $('#toggle').addEventListener('click', toggle);
  $('#prev').addEventListener('click', function () { step(-1); });
  $('#next').addEventListener('click', function () { step(1); });
  $('#alt').addEventListener('click', altSource);

  ui();
  init();

  if ('serviceWorker' in navigator && (HTTPS || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
